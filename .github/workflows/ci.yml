name: ci.yml
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: run lint
        run: make lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Build
        run: go build -v ./...

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Setup docker
        uses: docker/setup-docker-action@v5

      - name: Setup docker compose
        uses: docker/setup-compose-action@v2

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run tests
        run: make all_tests

  coverage:
    name: Go test coverage check
    runs-on: ubuntu-latest
    steps:
      - name: Setup docker
        uses: docker/setup-docker-action@v5

      - name: Setup docker compose
        uses: docker/setup-compose-action@v2

      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: generate test coverage
        run: make all_tests

      - name: check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yml
          profile: .coverage.out