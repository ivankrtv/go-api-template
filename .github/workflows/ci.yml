name: ci.yml
on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
#      - name: Setup docker
#        uses: docker/setup-docker-action@v5

      - name: Checkout repo
        uses: actions/checkout@latest

      - name: run lint
        run: make lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: go build -v ./...

  tests:
    runs-on: ubuntu-latest
    steps:
#      - name: Setup docker
#        uses: docker/setup-docker-action@v5

      - name: Checkout repo
        uses: actions/checkout@latest

      - name: Run tests
        run: make all_tests